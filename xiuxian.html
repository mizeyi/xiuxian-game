<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>仙途 · 凡人修仙传</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#1a1e32;font-family:"Noto Serif SC","KaiTi",serif;}
body{display:flex;justify-content:center;align-items:center;padding:0.3rem;color:#f0e8d5;}
.game-container{
    width:100%;max-width:520px;height:100%;background:linear-gradient(180deg,rgba(22,20,42,0.97),rgba(30,26,55,0.95));
    border:1px solid #8a6d3b;border-radius:1rem;padding:0.5rem;display:flex;flex-direction:column;gap:0.4rem;
    box-shadow:0 0 40px rgba(160,120,60,0.2),0 0 80px rgba(0,0,0,0.4),inset 0 0 60px rgba(80,60,30,0.08);overflow:hidden;
}
@keyframes btFlash{0%{box-shadow:0 0 20px gold,inset 0 0 20px gold}50%{box-shadow:0 0 80px orange,inset 0 0 80px orange}100%{box-shadow:0 0 0px gold,inset 0 0 0px gold}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes spk{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes sldIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.bt-glow{animation:btFlash 1.5s ease-out;}
.header{text-align:center;font-size:1.3rem;font-weight:bold;color:#ffe8a0;animation:flt 3s infinite;}
.pname{text-align:center;font-size:0.9rem;color:#fff;}
.stats{
    background:#2d2840;border-radius:0.8rem;padding:0.4rem 0.5rem;border:1px solid #7a6548;
    font-size:0.7rem;display:grid;grid-template-columns:repeat(3,1fr);gap:0.15rem 0.3rem;
}
.si{display:flex;align-items:center;gap:0.15rem;white-space:nowrap;}
.si span:last-child{color:#ffe8a0;font-weight:bold;}
.sbar{grid-column:1/-1;display:flex;align-items:center;gap:0.3rem;margin-top:0.05rem;}
.sbl{font-size:0.6rem;color:#c7b58a;white-space:nowrap;min-width:24px;}
.sbf{flex:1;height:5px;background:#3a3440;border-radius:10px;overflow:hidden;}
.sbi{height:100%;background:linear-gradient(90deg,#e0c060,#f9e8a0);width:0;transition:width 0.3s;}
.sbt{font-size:0.6rem;color:#ffe8a0;white-space:nowrap;}
.scene-b{display:flex;background:#2d2840;border-radius:0.8rem;padding:0.1rem;border:1px solid #8a7558;flex-shrink:0;flex-wrap:wrap;}
.scn{background:transparent;border:none;color:#c7b58a;padding:0.35rem 0.15rem;border-radius:0.7rem;
    font-weight:bold;font-size:0.68rem;flex:1;min-width:38px;text-align:center;cursor:pointer;touch-action:manipulation;transition:all 0.2s;}
.scn.active{background:#5a4a35;color:#ffe8a0;box-shadow:0 0 10px rgba(220,190,80,0.4);}
.pnl{background:#252838;border-radius:0.8rem;padding:0.6rem;border:1px solid #8a7558;
    display:none;flex-direction:column;gap:0.4rem;flex:1;min-height:0;overflow-y:auto;animation:sldIn 0.3s;}
.pnl.active{display:flex;}
.btn{
    background:#3d3455;border:1px solid #9a8560;color:#f8ecd0;padding:0.45rem 0.55rem;
    border-radius:0.9rem;font-weight:bold;font-size:0.72rem;cursor:pointer;text-align:center;touch-action:manipulation;
    transition:all 0.15s;white-space:nowrap;user-select:none;
}
.btn:active{background:#5a4d40;border-color:#d4c080;transform:scale(0.96);}
.btn.pr{background:#7a6040;border-color:#e8c060;}
.btn.dg{border-color:#c86060;color:#ffc8b8;}
.btn.gd{background:#7a6028;border-color:#ffe080;color:#ffe8a0;}
.btn:disabled{opacity:0.5;pointer-events:none;}
.bs{font-size:0.65rem;padding:0.3rem 0.5rem;}
.card{
    background:#2e2838;border-radius:0.7rem;padding:0.4rem 0.5rem;border:1px solid #9a7850;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.3rem;font-size:0.72rem;
}
.res-row{
    background:#241f30;border-radius:0.6rem;padding:0.35rem 0.5rem;border:1px solid #4a3f5e;
    font-size:0.7rem;color:#cdbfe0;display:flex;flex-wrap:wrap;gap:0.35rem;justify-content:center;
}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:0.3rem;}
.logbox{
    background:#1c2030;border-radius:0.6rem;padding:0.4rem;height:70px;flex-shrink:0;
    overflow-y:auto;font-size:0.65rem;color:#c8b890;border:1px solid #6a5840;line-height:1.35;
}
.evpnl{
    background:#342e48;border-radius:0.6rem;padding:0.5rem;border:1px solid #c8a860;
    display:none;font-size:0.72rem;animation:sldIn 0.2s;
}
.evopts{display:flex;gap:0.3rem;justify-content:center;margin-top:0.3rem;flex-wrap:wrap;}
.ovl{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;justify-content:center;align-items:center;z-index:9999;}
.mbox{background:#2a2540;border:2px solid #d4b868;border-radius:1rem;padding:1rem;text-align:center;min-width:260px;max-width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 0 30px rgba(200,160,80,0.2);}
.mbox h3{color:#ffe8a0;font-size:0.95rem;margin-bottom:0.5rem;}
.mbox input{padding:0.4rem;border-radius:0.8rem;border:1px solid #c7a55b;background:#383050;color:#ffe8a0;font-size:0.85rem;text-align:center;width:80%;margin:0.3rem 0;}
.gopt{font-size:1rem;cursor:pointer;padding:0.3rem 0.7rem;border-radius:0.8rem;border:2px solid transparent;display:inline-block;margin:0 0.3rem;transition:all 0.2s;user-select:none;}
.gopt.sel{border-color:#ffd700;background:rgba(255,215,0,0.2);}
.dfl{text-align:center;font-size:0.9rem;color:#ff9000;margin:0.3rem 0;}
.bname{color:#ff4444;font-size:1rem;animation:spk 1s infinite;}
.skill-bar{display:flex;flex-wrap:wrap;gap:0.3rem;margin:0.3rem 0;}
.build-card{background:#283040;border:1px solid #7a7a9a;border-radius:0.6rem;padding:0.4rem;font-size:0.7rem;display:flex;justify-content:space-between;align-items:center;}
.ach-card{background:#283a18;border:1px solid #7aa84a;border-radius:0.6rem;padding:0.3rem 0.5rem;font-size:0.68rem;display:flex;justify-content:space-between;align-items:center;}
.ach-card.locked{opacity:0.5;}

/* 场景立绘横幅已移除（v8.0 UI 重构）：场景标识改由 .scene-title 文字标题呈现，腾出纵向空间 */

/* 角色头像 */
.avatar-box{
    width:44px;height:44px;border-radius:50%;border:2px solid #c7a55b;
    flex-shrink:0;overflow:hidden;
    background-size:cover;background-position:center top;
    box-shadow:0 0 10px rgba(200,170,100,0.4);
}
.avatar-box.male{background-image:url('game-assets/hero-male.webp');border-color:#6a9fcf;box-shadow:0 0 10px rgba(100,150,220,0.4);}
.avatar-box.female{background-image:url('game-assets/hero-female.webp');border-color:#cf6a9a;box-shadow:0 0 10px rgba(220,130,180,0.4);}
/* Boss插图 */
.boss-img{width:100%;height:120px;border-radius:0.6rem;background-size:cover;background-position:center;margin:0.3rem 0;border:1px solid rgba(200,60,60,0.4);}
.boss-dragon{background-image:url('game-assets/boss-dragon.webp');}
.boss-fox{background-image:url('game-assets/boss-fox.webp');}
.boss-spirit{background-image:url('game-assets/boss-spirit.webp');}
/* NPC 全宽立绘已移除（v8.0）：NPC 场景改用文字标题 + 卡片内容，信息密度更高、不再占大图空间 */
/* 移动端适配 */
@media(max-width:480px){
    .boss-img{height:100px;background-size:contain;background-repeat:no-repeat;}
    .avatar-box{width:38px;height:38px;}
    .partner-box{width:46px;height:46px;}
}
/* 道侣头像 */
.partner-box{
    width:54px;height:54px;border-radius:50%;border:2px solid #e8a0c0;
    background-image:url('game-assets/partner.webp');
    background-size:cover;background-position:center;flex-shrink:0;
    box-shadow:0 0 12px rgba(220,150,180,0.4);
}
/* 场景标题装饰 */
.scene-header-bar{
    display:flex;align-items:center;gap:0.4rem;padding:0.2rem 0;
}
.scene-title{font-size:0.95rem;color:#ffe8a0;padding:0.25rem 0 0.1rem;letter-spacing:0.05rem;text-shadow:0 0 8px rgba(0,0,0,0.4);}
.settle-card{text-align:left;}
.settle-card h3{text-align:center;color:#ffd78b;margin:0.2rem 0 0.6rem;}
.settle-row{display:flex;justify-content:space-between;padding:0.28rem 0;border-bottom:1px solid rgba(200,170,100,0.12);font-size:0.85rem;}
.settle-row span{color:#b7a17c;}
.settle-tip{font-size:0.72rem;color:#9fb0c8;margin:0.5rem 0;text-align:center;}
.settle-btns{display:flex;flex-direction:column;gap:0.4rem;margin-top:0.6rem;}
.settle-btns .btn{width:100%;}
.scene-icon{font-size:1.4rem;}
/* 保存提示 */
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-60px);
    background:rgba(40,35,60,0.95);color:#ffe8a0;padding:0.5rem 1.2rem;border-radius:0.5rem;
    border:1px solid rgba(200,170,100,0.5);z-index:9999;font-size:0.8rem;
    transition:transform 0.3s,opacity 0.3s;opacity:0;pointer-events:none;
    box-shadow:0 4px 20px rgba(0,0,0,0.4);}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
/* 快捷操作栏 */
.quick-bar{
    display:flex;gap:0.3rem;padding:0.2rem 0;flex-shrink:0;justify-content:center;
}
/* ===== 突破/渡劫炫酷动画 ===== */
.trib-overlay{position:fixed;inset:0;z-index:9998;display:none;
    background:radial-gradient(ellipse at center,rgba(10,5,30,0.92),rgba(0,0,0,0.97));
    align-items:center;justify-content:center;flex-direction:column;overflow:hidden;}
.trib-overlay.show{display:flex;animation:tribFadeIn 0.3s ease;}
@keyframes tribFadeIn{from{opacity:0;}to{opacity:1;}}
/* 雷云 */
.trib-cloud{position:absolute;top:-10%;left:50%;transform:translateX(-50%);
    width:280px;height:120px;
    background:radial-gradient(ellipse at center,rgba(60,40,100,0.9),rgba(20,10,40,0.4) 60%,transparent);
    border-radius:50%;filter:blur(8px);
    animation:tribCloud 0.6s ease-out forwards;}
@keyframes tribCloud{from{top:-20%;opacity:0;}to{top:5%;opacity:1;}}
/* 闪电 */
.trib-bolt{position:absolute;top:8%;left:50%;width:3px;height:0;
    background:linear-gradient(to bottom,transparent,#fff,#a0d0ff,#fff,transparent);
    box-shadow:0 0 20px #a0d0ff,0 0 40px #6090ff;
    transform:translateX(-50%);
    animation:tribBolt 0.15s ease-out forwards;}
@keyframes tribBolt{0%{height:0;}50%{height:60vh;opacity:1;}100%{height:60vh;opacity:0.3;}}
/* 金光爆发 */
.trib-burst{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);
    width:0;height:0;border-radius:50%;
    background:radial-gradient(circle,rgba(255,240,180,0.95),rgba(255,200,80,0.6) 30%,rgba(255,160,40,0.2) 60%,transparent);
    animation:tribBurst 1.2s ease-out forwards;}
@keyframes tribBurst{0%{width:0;height:0;opacity:0;}20%{opacity:1;}100%{width:120vw;height:120vw;opacity:0;}}
/* 粒子环 */
.trib-ring{position:absolute;top:40%;left:50%;width:0;height:0;
    border:3px solid rgba(255,220,120,0.8);border-radius:50%;
    transform:translate(-50%,-50%);
    animation:tribRing 1s ease-out forwards;}
@keyframes tribRing{0%{width:0;height:0;opacity:1;border-width:4px;}100%{width:80vw;height:80vw;opacity:0;border-width:1px;}}
/* 大字 */
.trib-text{position:relative;z-index:2;font-size:2.2rem;font-weight:bold;
    letter-spacing:0.2rem;text-align:center;
    animation:tribTextIn 0.5s ease-out 0.3s both;}
.trib-text.success{color:#ffe8a0;text-shadow:0 0 20px rgba(255,200,80,0.8),0 0 40px rgba(255,160,40,0.5),0 0 8px rgba(255,240,180,0.6);}
.trib-text.fail{color:#ff6060;text-shadow:0 0 20px rgba(255,60,60,0.8),0 0 40px rgba(200,20,20,0.4);}
@keyframes tribTextIn{from{transform:scale(0.3);opacity:0;}to{transform:scale(1);opacity:1;}}
.trib-sub{font-size:0.9rem;color:#c0b0d0;margin-top:0.5rem;letter-spacing:0.1rem;
    animation:tribTextIn 0.5s ease-out 0.8s both;}
/* 飞升碎片 */
.trib-spark{position:absolute;width:4px;height:4px;border-radius:50%;
    background:#ffe8a0;box-shadow:0 0 6px #ffd060;pointer-events:none;}
@keyframes tribSpark{
    0%{transform:scale(0) translateY(0);opacity:0;}
    30%{transform:scale(1.5) translateY(-20px);opacity:1;}
    100%{transform:scale(0.5) translateY(60px);opacity:0;}
}
/* ===== V5 战斗可视化 ===== */
.combat-arena{display:flex;flex-direction:column;gap:0.35rem;margin:0.25rem 0;}
.cbt-card{position:relative;background:#2a2440;border:1px solid #7a6548;border-radius:0.7rem;padding:0.4rem;overflow:visible;}
.cbt-card.enemy{border-color:#c86060;}
.cbt-card.player{border-color:#6a9fcf;}
.cbt-card.boss{border-color:#ff5050;box-shadow:0 0 12px rgba(200,60,60,0.35);}
.cbt-top{display:flex;align-items:center;gap:0.4rem;}
.cbt-ava{width:36px;height:36px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px rgba(0,0,0,0.4);}
.cbt-ava.e{background:radial-gradient(circle,#7a3030,#3a1010);}
.cbt-ava.p{background:radial-gradient(circle,#30507a,#101a3a);}
.cbt-info{flex:1;min-width:0;}
.cbt-name{font-size:0.72rem;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cbt-hpbar{height:9px;background:#1a1628;border-radius:6px;overflow:hidden;margin-top:3px;position:relative;}
.cbt-hpfill{height:100%;background:linear-gradient(90deg,#e05050,#ff8080);transition:width 0.4s ease;border-radius:6px;}
.cbt-card.player .cbt-hpfill{background:linear-gradient(90deg,#3080e0,#80c0ff);}
.cbt-hptxt{font-size:0.58rem;color:#c8b890;margin-top:1px;}
.cbt-hit{animation:cbtShake 0.3s;}
@keyframes cbtShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.dmg-float{position:absolute;left:50%;top:2px;transform:translateX(-50%);font-weight:bold;font-size:1.05rem;pointer-events:none;animation:dfloat 0.9s ease-out forwards;z-index:50;text-shadow:0 0 4px #000;white-space:nowrap;}
.dmg-float.dmg{color:#ff7060;}
.dmg-float.crit{color:#ffd060;font-size:1.35rem;}
.dmg-float.heal{color:#70ff80;}
@keyframes dfloat{0%{opacity:0;transform:translateX(-50%) translateY(0) scale(0.6);}20%{opacity:1;transform:translateX(-50%) translateY(-6px) scale(1.1);}100%{opacity:0;transform:translateX(-50%) translateY(-32px) scale(1);}}
.cbt-log{font-size:0.6rem;color:#b8a888;height:32px;overflow-y:auto;background:#1a1628;border-radius:0.4rem;padding:0.2rem 0.3rem;border:1px solid #4a3a28;line-height:1.25;}
/* 自动修炼 / 连续攻击 */
.auto-row{display:flex;align-items:center;justify-content:center;gap:0.5rem;font-size:0.72rem;color:#9fd0a0;margin:0.2rem 0;flex-shrink:0;}
.toggle{position:relative;width:42px;height:22px;background:#3a3448;border-radius:12px;border:1px solid #7a6a4a;cursor:pointer;transition:all 0.2s;flex-shrink:0;}
.toggle.on{background:#3a7a4a;border-color:#6ac06a;}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#e8d8a0;transition:all 0.2s;}
.toggle.on::after{left:22px;background:#a0ffb0;}
.cult-ring{width:58px;height:58px;margin:0.2rem auto 0;border-radius:50%;background:conic-gradient(#ffd060 calc(var(--p,0)*1%),#3a3448 0);display:flex;align-items:center;justify-content:center;font-size:0.58rem;color:#ffe8a0;text-align:center;line-height:1.1;box-shadow:0 0 14px rgba(255,200,80,0.3);}
.auto-pulse{animation:apulse 1.6s infinite;}
@keyframes apulse{0%,100%{box-shadow:0 0 8px rgba(255,200,80,0.3);}50%{box-shadow:0 0 22px rgba(255,200,80,0.7);}}
/* 装备强化 */
.enh-badge{font-size:0.58rem;color:#ffb060;margin-left:0.25rem;font-weight:bold;}
.enh-bar{height:5px;background:#1a1628;border-radius:4px;overflow:hidden;margin-top:2px;width:60px;}
.enh-fill{height:100%;background:linear-gradient(90deg,#e09030,#ffd060);}
/* 离线收益提示 */
.offline-note{background:#2a3a2a;border:1px solid #5a8a4a;border-radius:0.5rem;padding:0.4rem;font-size:0.68rem;color:#a0e0a0;text-align:center;margin:0.2rem 0;}
/* 存档管理 */
.ta-export{width:100%;height:90px;font-size:0.6rem;background:#181428;color:#c8b890;border:1px solid #6a5840;border-radius:0.5rem;padding:0.3rem;resize:none;margin:0.3rem 0;}
.save-sec{border:1px solid #3a3450;border-left:3px solid #8a6ad0;border-radius:0.5rem;padding:0.5rem;margin:0.5rem 0;font-size:0.72rem;color:#cdbce8;}
.save-sec.danger{border-color:#5a2a2a;border-left-color:#c0392b;}
.save-sec b{color:#e8d8ff;font-size:0.78rem;}
.save-sec small{color:#9a8ab0;font-size:0.6rem;}
/* v6 道途/轮回选择 */
.dao-grid,.rein-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.4rem;margin:0.5rem 0;}
.dao-opt,.rein-opt{border:1px solid #3a3450;border-radius:0.5rem;padding:0.45rem;cursor:pointer;background:#15101f;display:flex;flex-direction:column;gap:0.15rem;}
.dao-opt b,.rein-opt b{font-size:0.8rem;color:#ffd78b;}
.dao-opt small,.rein-opt small{font-size:0.58rem;color:#9a8ab0;}
.dao-opt.sel,.rein-opt.sel{border-color:#b98cff;background:#221833;box-shadow:0 0 8px rgba(185,140,255,0.4);}
.note{font-size:0.62rem;color:#b7a17c;margin:0.3rem 0;}
</style>
</head>
<body>
<div class="game-container" id="gc">
<div class="header" id="realm">炼气期·前期</div>
<div class="pname" id="pname">无名修士</div>
<div class="stats" id="stats"></div>
<div class="quick-bar">
    <button class="btn bs pr" onclick="G.quickSp();G.save();" title="回满灵力(20灵石)">💠回满灵力</button>
    <button class="btn bs" onclick="G.quickHeal();G.save();" title="回满生命(15灵石)">💚回满生命</button>
    <button class="btn bs" onclick="G.quickMed();G.save();" title="调息回复(5灵石)">🌿调息</button>
</div>
<div class="scene-b">
    <button class="scn active" onclick="G.switchScene('cave')">洞府</button>
    <button class="scn" onclick="G.switchScene('estate')">仙府</button>
    <button class="scn" onclick="G.switchScene('sect')">宗门</button>
    <button class="scn" onclick="G.switchScene('wild')">野外</button>
    <button class="scn" onclick="G.switchScene('market')">坊市</button>
    <button class="scn" onclick="G.switchScene('dungeon')">副本</button>
    <button class="scn" onclick="G.switchScene('secret')">秘境</button>
    <button class="scn" onclick="G.switchScene('arena')">竞技</button>
</div>
<div class="pnl active" id="pnlCave"></div>
<div class="pnl" id="pnlEstate"></div>
<div class="pnl" id="pnlSect"></div>
<div class="pnl" id="pnlWild"></div>
<div class="pnl" id="pnlMarket"></div>
<div class="pnl" id="pnlDungeon"></div>
<div class="pnl" id="pnlSecret"></div>
<div class="pnl" id="pnlArena"></div>
<div class="evpnl" id="evpnl"><div id="evdesc"></div><div class="evopts" id="evopts"></div></div>
<div class="logbox" id="logbox">> 踏入仙途...</div>
<div style="display:flex;justify-content:space-between;flex-shrink:0;gap:0.3rem;">
    <button class="btn bs" onclick="G.showAch()">成就</button>
    <button class="btn bs" onclick="G.showDaily()">日常</button>
    <button class="btn bs" onclick="G.saveMenu()">存档</button>
    <button class="btn bs" onclick="G.manualLoad()">读档</button>

            if(s.tech.hpMul) s.mhp=Math.floor(s.mhp*s.tech.hpMul);

        s.msp=rm.spiritMax+s.r*5;
        if(rm.lifeBonus>5000) s.mag=1e99;
        else s.mag=80+rm.lifeBonus+(s.lfb||0)-(s.agr||0);
        s.mhp=Math.floor(rm.hpBase*(1+s.sr*0.12));
        (eq.rg||[]).forEach(function(a){if(a&&a.hp){var e2=a.enh||0;s.mhp+=Math.round(a.hp*(1+e2*0.12));}});
        if(eq.ar&&eq.ar.hp){var e1=eq.ar.enh||0;s.mhp+=Math.round(eq.ar.hp*(1+e1*0.12));}
        if(s.pet) s.mhp+=this.petHp(); // v8.1 走 petHp 派生(含等级成长)
        if(s.tech&&s.tech.hpMul) s.mhp=Math.floor(s.mhp*s.tech.hpMul);
        if(dt.mhpFloor&&dt.mhpFloor!==1) s.mhp=Math.floor(s.mhp*dt.mhpFloor); // v6 道途战力地板
        if(s.daoTu==='ti'&&s.tiLv>0) s.mhp+=Math.round(s.mhp*s.tiLv*0.10); // v6 淬体精通(天花板)
        s._fuBurst=(s.daoTu==='fu')?Math.min(2.0,1+s.fzLv*0.04):1; // v6 符爆发倍率
        s._zhenEff=(s.daoTu==='zhen')?Math.min(1.6,1+s.jzLv*0.05):1; // v6 阵效率
        var rb=this.relicBonus();                       // Wave2 遗物加成
        if(rb.ba) s.ba=Math.floor(s.ba*(1+rb.ba));
        if(this.faBa()) s.ba=Math.floor(s.ba*(1+this.faBa())); // v8.0 破障: 攻击独立乘区
        if(rb.mhp) s.mhp=Math.floor(s.mhp*(1+rb.mhp));
        if(this.faMhp()) s.mhp=Math.floor(s.mhp*(1+this.faMhp())); // v8.0 磐石: 气血上限独立乘区
        if(!isFinite(s.mhp)||s.mhp<=0) s.mhp=80;
        if(s.sp>s.msp) s.sp=s.msp;
        if(s.hp>s.mhp) s.hp=s.mhp;
        if(!isFinite(s.ag)||s.ag<0) s.ag=20;
        if(!isFinite(s.mag)||s.mag<=0) s.mag=100;
        if(s.ag>s.mag) s.ag=s.mag;
    },

    // v8.1 灵宠派生属性（含等级成长，常驻计入 recalc；旧版仅在战斗内临时加，高境界近乎为0）
    petAtk: function(){var p=this.s.pet;if(!p)return 0;var b=p.evo?p.evoAtk:p.atk;return Math.floor(b+(p.lv-1)*5);},
    petDef: function(){var p=this.s.pet;if(!p)return 0;var b=p.evo?p.evoDef:p.def;return Math.floor(b+(p.lv-1)*4);},
    petHp:  function(){var p=this.s.pet;if(!p)return 0;var b=p.evo?p.evoHp:p.hp;return Math.floor(b+(p.lv-1)*40);},
    // v8.1 功法神识/遁速派生（乘区，与面板显示一致；旧版 tech.ssense/dunst 定义却从未生效）
    effSsense: function(){return Math.floor((this.s.ssense||0)*(1+((this.s.tech&&this.s.tech.ssense)||0)));},
    effDunst: function(){return Math.floor((this.s.dunst||0)*(1+((this.s.tech&&this.s.tech.dunst)||0)));},

    subCost: function(){var s=this.s;return s.sr>=2?1e99:this.REALMS[s.r].subCost[s.sr];},
    brNeed: function(){return Math.floor(this.REALMS[this.s.r].subCost[1]*1.5);},
    maxCv: function(){return this.s.sr<2?this.subCost():this.brNeed();},
    brRate: function(){return Math.min(100,(this.s.bbr||0)+(this.s.bbrb||0) - this.faBrPen());}, // v8.0 磐石副作用: 突破率-2%/级
    agePen: function(){return Math.max(0.3,1-(this.s.ag-20)*0.006);},
    cvMul: function(){
        var m=this.ROOTS[this.s.rt].mult; // 灵根倍率直接决定修炼速度
        if(this.s.par) m+=this.s.par.sb||0;
        if(this.s.tech) m+=this.s.tech.cv||0; // 功法加成
        m += this.s.rootBonus||0;           // v6 轮回: 灵根基资质继承
        if(this.s.daoTu && this.DAOTU[this.s.daoTu]){
            m *= this.DAOTU[this.s.daoTu].cv||1;     // v6 道途修炼系数
            m += this.s.daoBonus||0;                 // v6 轮回: 道天赋继承
        }
        m*=this.agePen();
        if(this.s.es.sa>0) m+=this.s.es.sa*0.1;
        if(this.s.es.tr>0) m+=this.s.es.tr*0.05;
        m += this.relicCv();                           // Wave2 遗物修炼加成
        m += this.faCv();                              // v8.0 驻景: 修为获取
        if(this.s.faLv.bumie) m *= (1 - this.s.faLv.bumie*0.05); // v8.0 不灭副作用: 修炼速度-5%/级
        return Math.max(0.15,m);
    },
    cvGain: function(){return Math.floor((4+this.s.r*2.5)*(0.8+Math.random()*0.4)*this.cvMul()*(1+this.faSpd()));}, // v8.0 流光: 修炼速度+5%/级

    log: function(msg){

    cy: function(y){

        s.ag+=y;if(s.ag>=s.mag){this.log("寿元耗尽，轮回重修。");this.resetGame(true,'death');return false;}return true;
    },
    rma: function(y){
        var s=this.s;
        if(s.r>=6){s.ftl=Math.max(0,s.ftl-y);if(s.ftl<=0){this.log("飞升时限耗尽，轮回重修。");this.resetGame(true,'death');}return;}
        if(!isFinite(s.mag)) return;
        s.agr=(s.agr||0)+y;
        s.mag=Math.max(s.ag,s.mag-y);

    // v8.0.1+: 版本自检——启动后比对远端 version.json，发现新版本自动重载（解决静态托管缓存导致需手动硬刷的问题）
    _checkUpdate: function(){
        var self=this;
        try{
            fetch('version.json?t='+Date.now(),{cache:'no-store'})
                .then(function(r){ if(!r.ok) throw 0; return r.json(); })
                .then(function(j){
                    if(j&&j.ver&&j.ver!==self.VER){
                        // 本次会话已处理过该版本则跳过，避免重复触发
                        try{ if(sessionStorage.getItem('xq_upd')===j.ver) return; sessionStorage.setItem('xq_upd', j.ver); }catch(e){}
                        self._applyUpdate(j.ver);
                    }
                }).catch(function(){});
        }catch(e){ /* file:// 或离线环境静默降级 */ }
    },
    _applyUpdate: function(ver){
        var self=this;
        // 非阻塞提示，1.2s 后自动以缓存破坏 URL 重载（无需玩家手动点 Button，也不依赖 location.reload 命中缓存）
        try{
            var t=document.getElementById('toast');
            if(t){ t.textContent='🔄 发现新版本 '+ver+'，正在更新…'; t.style.display='block'; }
        }catch(e){}
        setTimeout(function(){ self._doUpdate(); }, 1200);
    },
    _doUpdate: function(){
        try{ this.save(); }catch(e){}
        try{ this._closeMod(); }catch(e){}
        // 跳转到带时间戳的缓存破坏 URL：浏览器缓存键含查询串→必为缓存未命中→向源站/CDN 拉取最新 HTML。
        // 已实测 CloudStudio 对 ?_= 查询串稳定返回最新文件（不会返回 CDN 旧缓存）。
        var u=location.href.split('#')[0].split('?')[0]+'?_='+Date.now();
        try{ location.replace(u); }catch(e){ try{ location.href=u; }catch(e2){} }
    },

    learnSkill: function(sid){
        if(this.s.skls.indexOf(sid)>=0){this.log("已学会此技能");return;}
        this.s.skls.push(sid);this.s.scds[sid]=0;

    // ===== 技能使用(战斗中) =====
    useSkill: function(sid, target){
        var sk=this.SKILLS.filter(function(s){return s.id===sid;})[0];
        if(!sk) return false;
        if(this.s.scds[sid]>0){this.log(sk.name+"冷却中("+this.s.scds[sid]+"回合)");return false;}
        if(this.s.sp<sk.cost){this.log("灵力不足(需"+sk.cost+")");return false;}
        this.s.sp-=sk.cost;
        this.s.scds[sid]=sk.cdMax;
        var mult=(this.s.daoTu==='fu'&&this.s._fuBurst)?this.s._fuBurst:1; // v6 符修爆发倍率
        if(sid==='fireball'){var d=Math.floor(this.s.ba*1.5*mult);target.hp-=d;this._pushFx('enemy',d,false);this.log("🔥火球术造成"+d+"伤害!");return d;}
        if(sid==='iceshard'){var d=Math.floor(this.s.ba*1.2*mult);target.hp-=d;target.slowed=2;this._pushFx('enemy',d,false);this.log("❄冰锥术造成"+d+"伤害,敌人减速2回合");return d;}
        if(sid==='thunder'){var d=Math.floor(this.s.ba*2.0*mult);target.hp-=d;this._pushFx('enemy',d,true);this.log("⚡雷霆一击暴击"+d+"伤害!");return d;}
        if(sid==='healskill'){var h=Math.floor(this.s.mhp*0.3);this.s.hp=Math.min(this.s.mhp,this.s.hp+h);this._pushFx('player',h,false,true);this.log("🌿回春术恢复"+h+"生命");return h;}
        if(sid==='shield'){this.s.shld=1;this.log("🛡金刚罩护体,下回合免伤50%");return true;}
        if(sid==='poison'){var d=Math.floor(this.s.ba*0.8*mult);target.hp-=d;target.poisoned=3;this._pushFx('enemy',d,false);this.log("☠毒雾术造成"+d+"伤害,中毒3回合");return d;}
        if(sid==='soulstrike'){var d=Math.floor(this.s.ba*1.0*mult);target.hp-=d;this._pushFx('enemy',d,false);this.log("👁神识冲击穿透"+d+"伤害");return d;}
        if(sid==='meteor'){var d=Math.floor(this.s.ba*2.5*mult);target.hp-=d;this._pushFx('enemy',d,true);this.log("☄陨星坠毁灭打击"+d+"伤害!");return d;}
        return false;
    },
    // 更新技能冷却
    _tickSkillCDs: function(){

    adoptPet: function(){
        if(this.s.pet){this.log("已有灵宠");return;}
        if(this.s.ss<200){this.log("灵石不足(需200)");return;}
        var t=G.PETS[Math.floor(Math.random()*G.PETS.length)];
        this.s.ss-=200;
        this.s.pet={nm:t.name,atk:t.atk,def:t.def,hp:t.hp,lv:1,exp:0,evo:false,evoLv:t.evoLv,evoName:t.evoName,evoAtk:t.evoAtk,evoDef:t.evoDef,evoHp:t.evoHp};
        this.recalc();this.log("获得灵宠【"+t.name+"】 助战：攻+"+this.petAtk()+" 护+"+(this.petDef()*2)+" 血+"+this.petHp());
        this.recalc();this.checkAch();this.refresh();
    },
    feedPet: function(){
        if(!this.s.pet){this.log("没有灵宠");return;}
        if(this.s.ss<10){this.log("灵石不足");return;}
        this.s.ss-=10;this.s.pet.exp+=this.rng(8,15);
        var p=this.s.pet;
        if(p.exp>=p.lv*20&&!p.evo&&p.lv>=p.evoLv){
            p.evo=true;p.nm=p.evoName; // v8.1 进化仅置标志，属性由 petAtk/Def/Hp 派生
            this.log("🌟灵宠进化！【"+p.evoName+"】 助战：攻+"+this.petAtk()+" 护+"+(this.petDef()*2)+" 血+"+this.petHp());
            this.checkAch();
        }else if(p.exp>=p.lv*20){
            p.lv++;p.exp=0; // v8.1 等级成长由派生函数计算，不再手动改 atk/def/hp
            this.log("灵宠升级至Lv."+p.lv+" 助战：攻+"+this.petAtk()+" 护+"+(this.petDef()*2)+" 血+"+this.petHp());
        }
        this.recalc();this.refresh();
    },

    addEq: function(eq, fromInv){
        var s=this.s; fromInv=fromInv||false;
        var old=null;
        if(eq.t==='weapon'){
            old=s.eq.wp; s.eq.wp=eq;
            this.log("装备武器【"+eq.name+"】(攻+"+eq.atk+")");
        }else if(eq.t==='armor'){
            old=s.eq.ar; s.eq.ar=eq;
            this.log("装备防具【"+eq.name+"】(防+"+eq.def+",HP+"+eq.hp+")");
        }else{
            if(s.eq.rg.length>=2){this.log("饰品槽已满");return;}
            s.eq.rg.push(eq);
            this.log("装备饰品【"+eq.name+"】");
            old=null;
        }
        // 卸下的装备放回背包
        if(old){s.inv.push(old);this.log(old.name+"放回背包");}
        // 从背包移除（如果是背包中装备的）
        if(fromInv){
            var idx=s.inv.indexOf(eq);
            if(idx>=0) s.inv.splice(idx,1);
        }
        this.recalc();this.checkAch();this.refresh();
    },

        this.s.ss-=pr;
        // 购买后放入背包
        var item={t:eq.t,name:eq.name,atk:eq.atk||0,def:eq.def||0,hp:eq.hp||0};
        this.s.inv.push(item);
        this.log("购买"+eq.name+"，已放入背包");
        this.refresh();

    // 装备强化：消耗灵石+药材，按百分比提升攻防血，上限+10
    enhanceEq: function(slot, idx){
        var e = slot==='rg' ? (this.s.eq.rg[idx]||null) : (this.s.eq[slot]||null);
        if(!e){this.log("无此装备");return;}
        var lv=e.enh||0;
        if(lv>=10){this.log(e.name+"已强化至满级(+"+lv+")");return;}
        var cost=150+lv*120, mat=2+lv;
        if(this.s.ss<cost){this.log("强化需"+cost+"灵石");return;}
        if(this.s.hb<mat){this.log("强化需"+mat+"药材");return;}
        this.s.ss-=cost;this.s.hb-=mat;
        e.enh=lv+1;
        this.recalc();this.s.hp=Math.min(this.s.mhp,this.s.hp);
        this.log(e.name+"强化至 +"+e.enh+"(攻防血提升)");
        this.refresh();

    // ===== v6 路径精通强化(天花板加成, cap10) =====
    enhancePath: function(kind){
        var s=this.s, R=this.REINC;
        var map={jian:{res:'jy',lv:'jyLv',base:150,step:120,name:'剑意→本命飞剑'},
                 zhen:{res:'jz',lv:'jzLv',base:150,step:120,name:'阵基→阵法'},
                 fu:{res:'fz',lv:'fzLv',base:120,step:90,name:'符纸→符箓'},
                 ti:{res:null,lv:'tiLv',base:80,step:60,name:'淬体→肉身'}};
        var m=map[kind]; if(!m){this.log("该道途无需资源强化");return;}
        var lv=s[m.lv]||0;
        if(lv>=R.lvCap){this.log(m.name+"已至满级("+lv+")");return;}
        var cost=m.base+lv*m.step;
        if(kind==='fu'){
            if(s.fz<cost||s.lm<cost){this.log("强化需"+cost+"符纸与"+cost+"灵墨");return;}
            s.fz-=cost; s.lm-=cost;
        }else if(m.res){
            if(s[m.res]<cost){this.log("强化需"+cost+"剑意/阵基");return;}
            s[m.res]-=cost;
        }else{
            if(s.ss<cost||(s.mag-s.ag)<5){this.log("淬体需"+cost+"灵石及寿元");return;}
            s.ss-=cost; this.rma(3);
        }
        s[m.lv]=lv+1;
        this.recalc();this.s.hp=Math.min(this.s.mhp,this.s.hp);
        this.log(m.name+"精通 +"+(lv+1)+" 级");
        this.refresh();
    },

    // ===== 事件系统 =====

    triggerEv: function(type, autoMode){
        var pool=this.EVP[type]||this.EVP.cv;
        var ei=Math.floor(Math.random()*pool.length);
        var ev=pool[ei];
        if(autoMode){
            var map=this.EV_AUTO[type]||{};
            var pick=ev.o[(map[ei]!=null)?map[ei]:0];
            this.log('（挂机自动）'+ev.d+' → '+pick.t);
            pick.a(); this.refresh(); this.save(); return;
        }
        this.s.evact=true;
        document.getElementById('evdesc').textContent=ev.d;
        var od=document.getElementById('evopts');od.innerHTML='';
        var self=this;
        ev.o.forEach(function(op){
            var btn=document.createElement('button');btn.className='btn bs';btn.textContent=op.t;
            btn.addEventListener('click',function(){op.a();self.endEv();});
            od.appendChild(btn);
        });
        document.getElementById('evpnl').style.display='block';
    },
    endEv: function(){this.s.evact=false;document.getElementById('evpnl').style.display='none';this.refresh();this.save();},
    chkEv: function(){if(this.s.evact){this.log("请先处理当前事件");return true;}return false;},

    // ===== 核心操作 =====
    cultivate: function(){
        if(this.chkEv()) return;
        if(this.s.sp<5){this.log("灵力不足");return;}
        var mx=this.maxCv();if(this.s.cv>=mx){this.log("修为已满，请突破");return;}
        this.s.sp-=Math.round(4*(1+this.faSpDrain())); // v8.0 破障副作用: 修炼灵力消耗+15%/级
        var g=this.cvGain();this.s.cv=Math.min(this.s.cv+g,mx);
        this.s.hp=Math.min(this.s.mhp,this.s.hp+Math.floor(this.s.mhp*0.03));
        if(!this.cy(0.5)) return;
        this.log("修炼 +"+g+"修为");
        if(this.ch(0.18)) this.triggerEv('cv', this.s.auto && this.s.autoEv);
        if(this.ch(0.08)&&!this.s.par) this.createPartner();
        if(this.s.r>=7 && this.ch(0.005)){ this.s.fa+=1; } // v8.0 飞升后修炼感悟法则点(长线)
        this.updDaily('cv');this.checkAch();this.refresh();
    },
    // ===== v6 道途专属修炼动作 =====
    daoAct: function(){
        if(this.chkEv()) return;
        var s=this.s, dt=this.DAOTU[s.daoTu]||this.DAOTU.san;
        if(!dt.act){this.log("散修无专属修炼，请择道");return;}
        var cm=this.cvMul();
        if(s.daoTu==='jian'){
            if(s.sp<6){this.log("灵力不足");return;}
            s.sp-=6; var g=this.cvGain(); s.cv=Math.min(s.cv+Math.floor(g*0.3),this.maxCv());
            var jy=Math.ceil(2*cm)+1; s.jy+=jy;
            this.log("悟剑 +"+jy+"剑意，修为+"+Math.floor(g*0.3));
        }else if(s.daoTu==='dan'){
            if(s.hb<2){this.log("药材不足(需2)");return;}
            s.hb-=2; var g2=this.cvGain(); s.cv=Math.min(s.cv+Math.floor(g2*0.2),this.maxCv());
            var ss=Math.round(8*cm);
            if((s.danDay||0)>=300){this.log("今日丹药已售罄(上限300)，仅得修为");}
            else{var add=Math.min(ss,300-(s.danDay||0)); s.ss+=add; s.danDay=(s.danDay||0)+add; this.log("炼丹感悟 +"+Math.floor(g2*0.2)+"修为，灵石+"+add);}
        }else if(s.daoTu==='ti'){
            if(s.hp<Math.floor(s.mhp*0.1)){this.log("气血过低，无法淬体");return;}
            var dec=Math.floor(s.mhp*0.08); s.hp-=dec;
            var g3=this.cvGain(); var v=Math.floor(g3*(dt.hitCv||1.3));
            s.cv=Math.min(s.cv+v,this.maxCv());
            this.rma(3); // 淬体伤身
            this.log("淬体修炼(挨打)，修为+"+v);
        }else if(s.daoTu==='zhen'){
            if(s.sp<5){this.log("灵力不足");return;}
            s.sp-=5; var jz=Math.ceil(2*cm)+1; s.jz+=jz;
            this.log("布阵 +"+jz+"阵基（副本效率提升）");
        }else if(s.daoTu==='fu'){
            if(s.sp<6){this.log("灵力不足");return;}
            s.sp-=6; var fz=Math.ceil(1.5*cm)+1, lm=Math.ceil(1.5*cm)+1; s.fz+=fz; s.lm+=lm;
            this.log("画符 +"+fz+"符纸 +"+lm+"灵墨");
        }
        if(!this.cy(0.2)) return;
        if(this.ch(0.05)&&!this.s.par) this.createPartner();
        this.updDaily('cv');this.checkAch();this.refresh();
    },
    subBreak: function(){
        if(this.chkEv()) return;
        if(this.s.sr>=2){this.log("已是后期，需渡劫");return;}
        var cost=this.subCost();
        if(this.s.cv<cost){this.log("需要"+cost+"修为");return;}
        this.s.cv-=cost;this.s.sr++;
        this.recalc();this.s.hp=this.s.mhp;
        this.log("突破至"+this.REALMS[this.s.r].name+"·"+['前期','中期','后期'][this.s.sr]);
        this.checkAch();this.refresh();
    },
    breakthrough: function(){
        if(this.chkEv()) return;
        if(this.s.sr<2){this.log("需达后期方可渡劫");return;}
        if(this.s.r>=this.REALMS.length-1){this.log("已达飞升境");return;}
        var n=this.brNeed();
        if(this.s.cv<n){this.log("需"+n+"修为引动天劫");return;}
        this.s.cv-=n;
        var rate=Math.min(0.98, this.brRate()/100 + Math.max(0,this.s.karma)/100*0.1*this.faKarmaMul()*(1-this.faKarmaStab())); // Wave3 善业 + v8.0 业镜放大/净业稳固
        var ok=this.ch(rate);
        if(ok && this.s.karma<0 && this.ch(this.mindDemon())){ ok=false; this.log('心魔趁业障入侵，渡劫失守！'); }
        this.s.bbrb=0;
        this.s.usedPillAt={}; // 新境界可重新服用突破丹药
        // 展示渡劫动画
        this._showTrib(ok);
        if(ok){
            this.s.r++;this.s.sr=0;
            this.s.bpu=0;this.s.gu=0;this.s.agr=0;
            if(this.s.r===6) this.s.ftl=1000;
            this.s.bbr=5+this.rng(1,15);
            this.recalc();this.s.hp=this.s.mhp;
            this.s.cv=Math.floor(this.s.cv*0.1);
            this.s.sp=this.s.msp;
            this.genMons();
            if(this.s.mas){this.s.mfv+=5;}
            if(!this.s.par&&this.ch(0.35)) this.createPartner();
            if(!this.s.pet&&this.ch(0.3)){var t=G.PETS[Math.floor(Math.random()*G.PETS.length)];this.s.pet={nm:t.name,atk:t.atk,def:t.def,hp:t.hp,lv:1,exp:0,evo:false,evoLv:t.evoLv,evoName:t.evoName,evoAtk:t.evoAtk,evoDef:t.evoDef,evoHp:t.evoHp};this.log("天降灵宠【"+t.name+"】");}
            if(this.s.r===2&&this.s.skls.indexOf('fireball')<0) this.learnSkill('fireball');
            if(this.s.r===3&&this.s.skls.indexOf('iceshard')<0) this.learnSkill('iceshard');
            if(this.s.r===4&&this.s.skls.indexOf('thunder')<0) this.learnSkill('thunder');
            if(this.s.r===5&&this.s.skls.indexOf('healskill')<0) this.learnSkill('healskill');
            // 神识 & 遁速增长
            var sg=this.rng(3,8), dg=this.rng(2,5);
            this.s.ssense=(this.s.ssense||0)+sg;
            this.s.dunst=(this.s.dunst||0)+dg;
        }else{
            this.rma(10);this.s.sp=Math.floor(this.s.sp*0.5);
            this.s.cv=Math.floor(this.s.cv*0.4);this.s.hp=Math.floor(this.s.hp*0.5);
        }
        this.cy(0.8);this.checkAch();this.refresh();
    },
    _showTrib: function(ok){
        var ov=document.getElementById('tribOverlay');
        if(!ov){return;}
        var rn=ok?this.REALMS[this.s.r+1].name:this.REALMS[this.s.r].name;
        // 境界特效颜色
        var clr='#ffe8a0', clr2='#ffd060';
        if(ok){
            var nr=this.s.r+1;
            if(nr===2) {clr='#ffd700';clr2='#e0b000';}      // 金丹：金色
            else if(nr===3){clr='#d0b0ff';clr2='#a060e0';}   // 元婴：紫色
            else if(nr===4){clr='#ff80b0';clr2='#d04080';}   // 化神：红色
            else if(nr===5){clr='#80d0ff';clr2='#2090e0';}   // 渡劫：蓝色
            else if(nr===6){clr='#ffffff';clr2='#c0c0ff';}   // 大乘：白色
            else if(nr===7){clr='#ffe8a0';clr2='#ffffff';}   // 飞升：金色+白
        }
        var html='<div class="trib-cloud" style="background:radial-gradient(ellipse at center,rgba('+this._hex2rgb(clr)+',0.9),rgba(20,10,40,0.4) 60%,transparent);"></div>';
        // 闪电
        for(var i=0;i<5;i++){
            var sh='box-shadow:0 0 20px '+clr+',0 0 40px '+clr2;
            if(!ok&&i===4) sh='box-shadow:0 0 20px #ff4040,0 0 40px #cc0000';
            html+='<div class="trib-bolt" style="animation-delay:'+(i*0.1)+'s;left:'+(38+i*6)+'%;background:linear-gradient(to bottom,transparent,'+clr+',#fff,'+clr+',transparent);'+sh+';"></div>';
        }
        if(ok){
            var rgb1=this._hex2rgb('#ffffff'), rgb2=this._hex2rgb(clr), rgb3=this._hex2rgb(clr2);
            html+='<div class="trib-burst" style="background:radial-gradient(circle,rgba('+rgb1+',0.95),rgba('+rgb2+',0.6) 30%,rgba('+rgb3+',0.2) 60%,transparent);"></div>';
            for(var j=0;j<3;j++) html+='<div class="trib-ring" style="animation-delay:'+(0.3+j*0.25)+'s;border-color:rgba('+this._hex2rgb(clr)+',0.8);"></div>';
            // 碎片
            for(var k=0;k<30;k++){
                var x=Math.random()*100,y=Math.random()*100,dl=0.3+Math.random()*0.8;
                html+='<div class="trib-spark" style="left:'+x+'%;top:'+y+'%;animation:tribSpark '+dl+'s ease-out '+dl+'s both;background:'+clr+';box-shadow:0 0 6px '+clr2+';"></div>';
            }
            // 境界特定文字
            var tit='⚡ 渡劫成功 ⚡', sub='踏入 '+rn+' · 前期';
            if(this.s.r+1===2) tit='🌟 金丹结成 🌟';
            else if(this.s.r+1===3) tit='👶 元婴出世 👶';
            else if(this.s.r+1===4) tit='🔥 化神天尊 🔥';
            else if(this.s.r+1===5) tit='🌊 渡劫真人 🌊';
            else if(this.s.r+1===6) tit='👑 大乘尊者 👑';
            else if(this.s.r+1===7) tit='✨ 飞升仙界 ✨';
            html+='<div class="trib-text success" style="margin-top:12vh;color:'+clr+';text-shadow:0 0 20px '+clr+',0 0 40px '+clr2+',0 0 60px '+clr+';">'+tit+'</div>';
            html+='<div class="trib-sub" style="font-size:1.1rem;color:'+clr+';">'+sub+'</div>';
            // 追加骚话
            var quotes={2:'一粒金丹吞入腹，始知我命不由天',3:'元婴结成，神魂不灭',4:'化神天尊，万法归宗',5:'天劫淬体，大道可期',6:'大乘圆满，飞升在即',7:'渡尽劫波，羽化登仙'};
            if(quotes[this.s.r+1]) html+='<div class="trib-sub" style="font-size:0.7rem;color:#b0a0d0;">'+quotes[this.s.r+1]+'</div>';
        }else{
            html+='<div class="trib-bolt" style="background:linear-gradient(to bottom,transparent,#ff4040,#ff8060,#ff4040,transparent);box-shadow:0 0 20px #ff4040,0 0 40px #cc0000;animation-delay:0.5s;"></div>';
            html+='<div class="trib-text fail" style="margin-top:12vh;">💥 渡劫失败 💥</div>';
            html+='<div class="trib-sub">寿元 -10 年 · 修为折损 · 道心受损</div>';
        }
        ov.innerHTML=html;
        ov.classList.add('show');
        var self=this;
        setTimeout(function(){
            ov.classList.remove('show');
            ov.innerHTML='';
        },ok?3000:2500);
    },

    // ===== 功法系统 =====
    learnTech: function(tid){
        var tech=this.TECHNIQUES.filter(function(t){return t.id===tid;})[0];
        if(!tech) return;
        if(this.s.r<tech.req){this.log("需"+this.REALMS[tech.req].name+"方可修炼");return;}
        if(!this.s.techSkills) this.s.techSkills=[];
        if(this.s.techSkills.indexOf(tid)>=0 && this.s.tech&&this.s.tech.id===tid){this.log("已修炼此功法");return;}
        // 记录已获得
        if(this.s.techSkills.indexOf(tid)<0) this.s.techSkills.push(tid);
        // 切换功法
        var old=this.s.tech?this.s.tech.name:'无';
        this.s.tech={id:tech.id,name:tech.name,cv:tech.cv,atk:tech.atk,def:tech.def||0,hpMul:tech.hpMul||0,dunst:tech.dunst||0,ssense:tech.ssense||0};
        this.recalc();this.s.hp=this.s.mhp;
        var tiers={黄:'🟤',玄:'🟣',地:'🔵',天:'🟡'};
        this.log("修炼功法【"+(tiers[tech.tier]||'')+tech.name+'】('+tech.tier+'级'+(old!=='无'?'，替换'+old:'')+')');
        this.refresh();
    },
    // 获取功法（各系统调用，不自动装备）
    _acquireTech: function(tid){
        if(!this.s.techSkills) this.s.techSkills=[];
        // 数组参数：从池中选一个可用的
        if(Array.isArray(tid)){
            var eligible=[];
            for(var i=0;i<tid.length;i++){
                var t=this.TECHNIQUES.filter(function(x){return x.id===tid[i];})[0];
                if(t&&this.s.r>=t.req&&this.s.techSkills.indexOf(t.id)<0) eligible.push(t);
            }
            if(eligible.length===0) return false;
            var pick=eligible[Math.floor(Math.random()*eligible.length)];
            return this._acquireTech(pick.id);
        }
        // 单id
        if(this.s.techSkills.indexOf(tid)>=0) return false;
        var tech=this.TECHNIQUES.filter(function(t){return t.id===tid;})[0];
        if(!tech) return false;
        if(this.s.r<tech.req) return false;
        this.s.techSkills.push(tid);
        var tiers={黄:'🟤',玄:'🟣',地:'🔵',天:'🟡'};
        this.log("📖 获得功法【"+(tiers[tech.tier]||'')+tech.name+"】("+tech.tier+"级)，可在洞府切换");
        if(!this.s.tech||this.s.tech.id==='basicQi'){
            this.s.tech={id:tech.id,name:tech.name,cv:tech.cv,atk:tech.atk,def:tech.def||0,hpMul:tech.hpMul||0,dunst:tech.dunst||0,ssense:tech.ssense||0};
        }
        this.recalc();return true;
    },
    // ===== 突破丹药 =====
    craftPill: function(pid){
        var p=this.PILLS[pid];
        if(!p) return;
        if(this.s.hb<p.mat){this.log("需"+p.mat+"药材");return;}
        if(this.s.ss<p.cost){this.log("需"+p.cost+"灵石");return;}
        this.s.ss-=p.cost;this.s.hb-=p.mat;
        if(!this.s.pills) this.s.pills={};
        // 丹药品级：神识越高，出高品概率越大
        var sc=this.effSsense(); // v8.1 功法神识加成生效
        var r=Math.random()+sc*0.003;
        var grade=r>0.9?'极品':r>0.7?'上品':r>0.5?'中品':'下品';
        var mult={下品:0.5,中品:1.0,上品:1.3,极品:1.8};
        if(!this.s.pills[pid]) this.s.pills[pid]={};
        var gk=grade; // grade 本身已是"下品/中品/上品/极品"
        this.s.pills[pid][gk]=(this.s.pills[pid][gk]||0)+1;
        var eff=Math.floor(p.rwd*mult[grade]);
        this.log("炼制"+grade+p.name+"，突破率+"+eff+"%");
        this.refresh();
    },
    // v8.1 一键炼丹：药材→修为（药材新 sink）。每药材≈3次修炼量，灵石消耗随批；比例 [PLACEHOLDER] 待 playtest
    alchemyCv: function(){
        var s=this.s; var per=5;
        if(s.hb<1){this.log("没有药材");return;}
        var n=Math.min(per,s.hb);
        var cost=Math.floor(n*6);
        if(s.ss<cost){this.log("需"+cost+"灵石");return;}
        s.hb-=n; s.ss-=cost;
        var gain=Math.floor(this.cvGain()*3*n);
        s.cv=Math.min(s.cv+gain,this.maxCv());
        this.log("🍵炼丹化修为：耗药材"+n+"+灵石"+cost+"，修为+"+gain);
        this.recalc();this.refresh();
    },

        if(!this.s.pills||!this.s.pills[pid]||!(this.s.pills[pid][grade]||0)){this.log("没有此丹药");return;}
        if(this.s.r+1!==p.realmLvl){this.log(p.name+"仅用于突破至"+this.REALMS[p.realmLvl].name);return;}
        if(!this.s.usedPillAt) this.s.usedPillAt={};
        if(this.s.usedPillAt[this.s.r]){this.log("本境界已服用过突破丹药，最多一粒");return;}
        var mult={下品:0.5,中品:1.0,上品:1.3,极品:1.8};
        var eff=Math.floor(p.rwd*mult[grade]);
        this.s.pills[pid][grade]--;
        if(this.s.pills[pid][grade]<=0) delete this.s.pills[pid][grade];
        this.s.bbrb=Math.min(100,this.s.bbrb+eff);
        this.s.usedPillAt[this.s.r]=true;

    secExp: function(idx){
        if(this.chkEv()) return;
        var sr=this.SECRET_REALMS[idx];
        if(!sr){return;}
        if(this.s.sp<sr.cost){this.log("灵力不足(需"+sr.cost+")");return;}
        // 境界匹配度：高于秘境需求时收益急剧衰减
        var diff=this.s.r-sr.minR;
        var decay=diff<=0?1:Math.pow(0.15,diff); // 1级=15%, 2级=2.25%, 3级≈0.3%
        if(decay<0.01) decay=0;
        this.s.sp-=sr.cost;
        if(decay<=0){this.log(sr.name+"已无探索价值(境界差距过大)");this.cy(0.3);this.refresh();return;}
        var r=Math.random();
        if(r<0.2){this.triggerEv('sc');return;}
        else if(r<0.4){var ss=Math.floor(sr.ss*decay);this.s.ss+=ss;this.log(sr.name+"灵石+"+ss+(decay<1?'(衰减'+(decay*100).toFixed(0)+'%)':''));}
        else if(r<0.6){var cv=Math.floor(sr.cv*decay);this.s.cv=Math.min(this.s.cv+cv,this.maxCv());this.log(sr.name+"悟道+"+cv+(decay<1?'(衰减'+(decay*100).toFixed(0)+'%)':''));}
        else if(r<0.75&&decay>0.7){var e=this.EQUIPS[Math.floor(Math.random()*this.EQUIPS.length)];var it={t:e.t,name:e.name,atk:e.atk||0,def:e.def||0,hp:e.hp||0};this.s.inv.push(it);this.log("获得"+it.name+"，已入背包（装备管理手动穿戴）");}
        else if(r<0.9&&decay>0.5){this.s.hb+=Math.floor(2*decay);this.log("药材+"+Math.floor(2*decay));}
        else{this.s.hp=Math.max(0,this.s.hp-30);this.rma(3);this.log("秘境遇险");if(this.s.hp<=0) this.hpDeath();}
        if(!this.s.par&&this.ch(0.18)) this.createPartner();
        // 功法掉落(神识越高越容易发现功法)
        var sc=this.s.ssense||0;
        if(this.ch(0.12+sc*0.005)){
            if(this._acquireTech(this.techPools.sc)) this.log("📖 秘境中发现功法！");
        }
        if(!this.cy(1.0)) return;
        this.refresh();
    },

    secMonster: function(pow,type){

        var pow=(1+0.15*run.cur)*tierMul;
        var coin=Math.floor((run.cur+1)*8*tierMul*(1+this.secBlessCoin())); // [PLACEHOLDER] 秘境币/层×(1+丰饶)
        var type=run.layers[run.cur];
        if(type==='event'){ this.triggerEv('kar'); run.cur++; this.refresh(); return; }
        var mon=this.secMonster(pow,type);
        var win = s.ba>=mon.atk*1.2 ? true : (s.ba>mon.atk*0.6 ? this.ch(0.7) : this.ch(0.3));
        if(win){
            s.my+=coin; run.rewards+=coin;
            s.hp=Math.max(1,s.hp-Math.floor(mon.atk*0.25));

        }

        try{
            localStorage.setItem(this.SAVE_KEY,JSON.stringify(this.s));
            localStorage.setItem(this.MANUAL_KEY,JSON.stringify(this.s));
            this._toast('已保存（可读档回退）');
        }catch(e){
            console.warn('手动保存失败:',e);

    _toast: function(msg){
        var t=document.getElementById('toast');
        if(!t){return;}
        t.textContent=msg;
        t.classList.add('show');
        clearTimeout(this._toastTm);
        var self=this;
        this._toastTm=setTimeout(function(){t.classList.remove('show');},1500);
    },
    _autosave: null,
    startAutosave: function(){
        if(this._autosave){return;}
        var self=this;
        this._autosave=setInterval(function(){self.save(true);},30000);
        window.addEventListener('beforeunload',function(){self.save(true);});
        document.addEventListener('visibilitychange',function(){if(document.hidden){self.save(true);}});
    },
    load: function(){
        try{
            this._needDaoPrompt=false; // v6: 老档迁移后自动提示择道一次
            var raw=localStorage.getItem(this.SAVE_KEY);
            if(!raw){this.startNew();return false;}
            var ld=JSON.parse(raw);
            if(!ld||typeof ld!=='object'){this.startNew();return false;}
            var def=this.defState();
            for(var k in def){if(ld.hasOwnProperty(k))this.s[k]=ld[k];else this.s[k]=def[k];}
            // Fix numeric fields
            var nf=['r','sr','cv','sp','msp','hp','mhp','ba','df','ss','ag','mag','mrw','dflr','dc','di','bbr','bbrb','bpu','gu','ctr','hb','aw','ark','mk','ac','lfb','agr','ftl','ssense','dunst'];
            var self=this;
            nf.forEach(function(f){if(typeof self.s[f]!=='number'||!isFinite(self.s[f]))self.s[f]=def[f];});
            if(!Array.isArray(this.s.mons)||!this.s.mons.length) this.genMons();
            if(!Array.isArray(this.s.skls)) this.s.skls=[];
            if(typeof this.s.scds!=='object') this.s.scds={};
            if(!this.s.eq||typeof this.s.eq!=='object') this.s.eq={wp:null,ar:null,rg:[]};
            if(!Array.isArray(this.s.eq.rg)) this.s.eq.rg=[];
            if(!this.s.es||typeof this.s.es!=='object') this.s.es={hf:0,ar:0,sa:0,tr:0};
            if(typeof this.s.achs!=='object') this.s.achs={};
            if(!this.ROOTS[this.s.rt]) this.s.rt='five';
            // v6 道途/轮回迁移: 旧档补默认, 不破坏现有存档
            if(!this.DAOTU[this.s.daoTu]) this.s.daoTu='san';
            if(!this.s.meta||typeof this.s.meta!=='object') this.s.meta={lives:1,legacy:0,inherit:{},dead:false};
            if(typeof self.s.rootBonus!=='number') self.s.rootBonus=0;
            if(typeof self.s.daoBonus!=='number') self.s.daoBonus=0;
            if(typeof self.s.magBonus!=='number') self.s.magBonus=0;
            ['jy','jz','fz','lm','jyLv','jzLv','fzLv','lmLv','tiLv'].forEach(function(k){if(typeof self.s[k]!=='number'||!isFinite(self.s[k]))self.s[k]=0;});
            if(!Array.isArray(this.s.inv)) this.s.inv=[];
            if(typeof this.s.hhc!=='number') this.s.hhc=0;
            if(typeof this.s.shld!=='number') this.s.shld=0;
            if(!this.s.pills||typeof this.s.pills!=='object') this.s.pills={};
            // 迁移：清洗旧版"品品"重复key
            var mig={};
            Object.keys(this.s.pills).forEach(function(pid){
                var entry=this.s.pills[pid];
                if(typeof entry==='number'){mig[pid]=entry;return;} // 旧版直接数字计数
                var clean={};
                Object.keys(entry).forEach(function(gk){
                    var fixed=gk.replace('品品','品'); // 修复重复"品"
                    clean[fixed]=(clean[fixed]||0)+entry[gk];
                });
                mig[pid]=clean;
            }.bind(this));
            this.s.pills=mig;
            if(this.s.tech&&typeof this.s.tech!=='object') this.s.tech=null;
            if(!Array.isArray(this.s.techSkills)) this.s.techSkills=[];
            this.recalc();
            // ===== 离线收益（闭关结算）=====
            var _offMs=Date.now()-(this.s.lastSeen||Date.now());
            var _offCap=8*3600*1000; // 收益封顶8小时
            if(_offMs>60000){
                var _eff=Math.min(_offMs,_offCap), _cap=_offMs>_offCap;
                var _ticks=Math.floor(_eff/2000); // 约每2秒1次修炼（保守）
                var _per=Math.max(1,Math.floor((4+this.s.r*2.5)*0.8*this.cvMul()));
                var _mx=this.maxCv(), _bf=this.s.cv;
                this.s.cv=Math.min(this.s.cv+_ticks*_per,_mx);
                var _gn=this.s.cv-_bf, _hrs=Math.min(1,_eff/3600000);
                this.s.hp=Math.min(this.s.mhp,this.s.hp+Math.floor(_hrs*0.4*this.s.mhp));
                this.s.sp=Math.min(this.s.msp,this.s.sp+Math.floor(_hrs*0.5*this.s.msp));
                var _mn=Math.floor(_eff/60000), _hh=Math.floor(_mn/60), _mm=_mn%60;
                var _msg='闭关归来：离线'+(_hh>0?_hh+'时':'')+_mm+'分'+(_cap?'(收益封顶8h)':'')+'，修为+'+_gn+(this.s.cv>=_mx?'（修为已满，可突破）':'');
                this.s.logs.push(_msg);if(this.s.logs.length>20)this.s.logs.shift();
            }
            this.s.lastSeen=Date.now();
            if(!isFinite(this.s.hp)||this.s.hp<=0) this.s.hp=this.s.mhp;
            if(this.s.hp>this.s.mhp) this.s.hp=this.s.mhp;
            if(ld.daoTu===undefined && this.s.daoTu==='san') this._needDaoPrompt=true; // 老档(无道途字段)迁移: 载入后提示择道一次
            return true;
        }catch(e){console.warn("存档加载失败:",e);localStorage.removeItem(this.SAVE_KEY);this.startNew();return false;}

    manualLoad: function(){
        var raw=localStorage.getItem(this.MANUAL_KEY);
        if(!raw){this._toast('无存档');return;}
        if(!confirm('读取存档将覆盖当前进度，确定？')) return;

            var ld=JSON.parse(raw);
            if(!ld||typeof ld!=='object'){this._toast('存档损坏');return;}
            var def=this.defState();
            for(var k in def){if(ld.hasOwnProperty(k))this.s[k]=ld[k];else this.s[k]=def[k];}
            var nf=['r','sr','cv','sp','msp','hp','mhp','ba','df','ss','ag','mag','mrw','dflr','dc','di','bbr','bbrb','bpu','gu','ctr','hb','aw','ark','mk','ac','lfb','agr','ftl','ssense','dunst'];
            var self=this;
            nf.forEach(function(f){if(typeof self.s[f]!=='number'||!isFinite(self.s[f]))self.s[f]=def[f];});
            if(!Array.isArray(this.s.mons)||!this.s.mons.length) this.genMons();
            if(!Array.isArray(this.s.skls)) this.s.skls=[];
            if(typeof this.s.scds!=='object') this.s.scds={};
            if(!this.s.eq||typeof this.s.eq!=='object') this.s.eq={wp:null,ar:null,rg:[]};
            if(!Array.isArray(this.s.eq.rg)) this.s.eq.rg=[];
            if(!this.s.es||typeof this.s.es!=='object') this.s.es={hf:0,ar:0,sa:0,tr:0};
            if(typeof this.s.achs!=='object') this.s.achs={};
            if(!this.ROOTS[this.s.rt]) this.s.rt='five';
            // v6 道途/轮回迁移: 旧档补默认, 不破坏现有存档
            if(!this.DAOTU[this.s.daoTu]) this.s.daoTu='san';
            if(!this.s.meta||typeof this.s.meta!=='object') this.s.meta={lives:1,legacy:0,inherit:{},dead:false};
            if(typeof self.s.rootBonus!=='number') self.s.rootBonus=0;
            if(typeof self.s.daoBonus!=='number') self.s.daoBonus=0;
            if(typeof self.s.magBonus!=='number') self.s.magBonus=0;
            ['jy','jz','fz','lm','jyLv','jzLv','fzLv','lmLv','tiLv'].forEach(function(k){if(typeof self.s[k]!=='number'||!isFinite(self.s[k]))self.s[k]=0;});
            if(!Array.isArray(this.s.inv)) this.s.inv=[];
            if(typeof this.s.hhc!=='number') this.s.hhc=0;
            if(typeof this.s.shld!=='number') this.s.shld=0;
            if(!this.s.pills||typeof this.s.pills!=='object') this.s.pills={};
            // 迁移：清洗旧版"品品"重复key
            var mig={};
            Object.keys(this.s.pills).forEach(function(pid){
                var entry=this.s.pills[pid];
                if(typeof entry==='number'){mig[pid]=entry;return;} // 旧版直接数字计数
                var clean={};
                Object.keys(entry).forEach(function(gk){
                    var fixed=gk.replace('品品','品'); // 修复重复"品"
                    clean[fixed]=(clean[fixed]||0)+entry[gk];
                });
                mig[pid]=clean;
            }.bind(this));
            this.s.pills=mig;
            if(this.s.tech&&typeof this.s.tech!=='object') this.s.tech=null;
            if(!Array.isArray(this.s.techSkills)) this.s.techSkills=[];
            this.recalc();
            if(!isFinite(this.s.hp)||this.s.hp<=0) this.s.hp=this.s.mhp;
            if(this.s.hp>this.s.mhp) this.s.hp=this.s.mhp;
            this._toast('读档成功');
            this.log('读取存档成功');
            this.refresh();
            this.switchScene(this.s.sc||'cave');
        }catch(e){
            console.warn("手动读档失败:",e);
            this._toast('读档失败：'+(e.message||'存档损坏'));
        }

    _showSettlement: function(leg, cause){
        var s=this.s;
        var causeTxt={death:'道陨',ascend:'飞升转世',manual:'主动重修'}[cause]||'重修';
        var liveMs=Date.now()-(s.bornAt||Date.now());

        var liveStr= days>0? (days+'天'+(hrs%24)+'时') : (hrs>0? (hrs+'时'+(mins%60)+'分') : (mins+'分'));
        var achN=Object.keys(s.achs||{}).length;
        var lives=(s.meta&&s.meta.lives)||1;

            '<h3>'+causeTxt+' · 本世结算</h3>'+
            '<div class="settle-row"><span>最终境界</span><b>'+this.REALMS[s.r].name+'</b></div>'+
            '<div class="settle-row"><span>本世成就</span><b>'+achN+' 项</b></div>'+
            '<div class="settle-row"><span>轮回世数</span><b>第 '+lives+' 世</b></div>'+
            '<div class="settle-row"><span>本世存活</span><b>'+liveStr+'</b></div>'+
            '<div class="settle-row"><span>道统底蕴</span><b style="color:#ffd78b;">'+leg+'</b></div>'+
            (faInfo?'<div class="settle-row"><span>法则</span><b>'+faInfo+'</b></div>':'')+
            '<div class="settle-tip">'+ (leg>0? '可转世重修传承道统底蕴，或彻底重开清零一切':'无底蕴可传承，仅可彻底重开') +'</div>'+
            '<div class="settle-btns">'+
            (leg>0?'<button class="btn pr" id="settleReinc">转世重修（传承 '+leg+' 底蕴）</button>':'')+
            '<button class="btn dg" id="settleHard">彻底重开（清空一切）</button>'+

    _hardReset: function(){

        this.startNew();
        this._closeMod();

    legacyOf: function(){
        var s=this.s, R=this.REINC;
        var leg=R.flyBase*(s.r/7); // 按最高境界比例给底蕴
        leg+=(Object.keys(s.achs||{}).length)*R.achEach; // 成就越多底蕴越厚
        if(s.faLv&&s.faLv.guiyuan) leg=Math.floor(leg*(1+s.faLv.guiyuan*0.2)); // v8.0 归元: 轮回继承效率+20%/级
        leg=Math.min(leg,R.cap); // 封顶防无限叠
        return Math.floor(leg);
    },
    _reincarnate: function(leg){
        var self=this, R=this.REINC;
        var pend={root:0,dao:0,pack:false,life:0}, cur=leg;
        function render(){
            var html='<h3>轮回重修 · 道统传承</h3>'+
                '<div class="note">本世道统底蕴：<b style="color:#ffd78b;">'+leg+'</b> 点（已用 '+(leg-cur)+'）</div>'+
                '<div class="rein-grid">';
            html+='<div class="rein-opt" data-k="root"><b>灵根基 +'+R.rootStep+'</b><small>灵根资质(已+'+(pend.root*R.rootStep).toFixed(2)+')</small><small>耗'+R.rootCost+'/级 上限+'+(R.rootCap).toFixed(1)+'</small></div>';
            html+='<div class="rein-opt" data-k="dao"><b>道天赋 +'+(R.daoStep*100)+'%</b><small>本道修炼(已+'+(pend.dao*R.daoStep*100).toFixed(0)+'%)</small><small>耗'+R.daoCost+'/级 上限'+(R.daoCap*100).toFixed(0)+'%</small></div>';
            html+='<div class="rein-opt'+(pend.pack?' sel':'')+'" data-k="pack"><b>资源包</b><small>开局灵石+药材</small><small>耗'+R.packCost+'</small></div>';
            html+='<div class="rein-opt" data-k="life"><b>寿元 +'+R.lifeAdd+'</b><small>寿元上限(已+'+(pend.life*R.lifeAdd)+')</small><small>耗'+R.lifeCost+'/级</small></div>';
            html+='</div><div style="margin-top:0.4rem;"><button class="btn" id="reinReset">重置</button> <button class="btn pr" id="reinGo">转世飞升</button></div>';
            self.mod(html);
            setTimeout(function(){
                document.querySelectorAll('.rein-opt').forEach(function(el){
                    el.addEventListener('click',function(){
                        var k=el.getAttribute('data-k');
                        if(k==='pack'){ if(!pend.pack&&cur>=R.packCost){pend.pack=true;cur-=R.packCost;} else if(pend.pack){pend.pack=false;cur+=R.packCost;} el.classList.toggle('sel'); }
                        else{
                            var cost=k==='root'?R.rootCost:(k==='dao'?R.daoCost:R.lifeCost);
                            var cap=k==='root'?Math.round(R.rootCap/R.rootStep):(k==='dao'?Math.round(R.daoCap/R.daoStep):99);
                            if(pend[k]<cap&&cur>=cost){pend[k]++;cur-=cost;}
                        }
                        render();
                    });
                });
                var rb=document.getElementById('reinReset');
                if(rb) rb.addEventListener('click',function(){pend={root:0,dao:0,pack:false,life:0};cur=leg;render();});
                var gb=document.getElementById('reinGo');
                if(gb) gb.addEventListener('click',function(){ self._applyReincarnate(leg,pend); });
            },50);
        }
        render();
    },
    _applyReincarnate: function(leg, pend){
        var R=this.REINC, oldDao=this.s.daoTu, oldLives=this.s.meta.lives, self=this, oldRel=this.s.relCodex||{};
        var oldFaSum=this._faLvSum?this._faLvSum():0, oldDaoSeed=(this.s.faLv&&this.s.faLv.daozhong)||0; // v8.0 法则继承捕获(重建前)
        this.s=this.defState();
        this.s.meta={lives:oldLives+1, legacy:0, inherit:pend, dead:false};
        this.s.fa=Math.floor(oldFaSum*0.3)+oldDaoSeed*10; // v8.0 法则继承: 旧世法则总等级×0.3折算 + 道种下世开局法则点
        this.s.relCodex=oldRel;                       // Wave2 遗物图鉴随轮回继承
        this.s.wei=Math.floor(leg*0.02);              // Wave3 威望根基继承(声望起点)
        this.s.rootBonus=pend.root*R.rootStep;     // v6 继承: 灵根资质
        this.s.daoBonus=pend.dao*R.daoStep;         // v6 继承: 道天赋
        this.s.magBonus=pend.life*R.lifeAdd;        // v6 继承: 寿元
        this.s.rt=Object.keys(this.ROOTS)[Math.floor(Math.random()*5)];
        this.s.bbr=5+this.rng(1,15);
        this.recalc();this.genMons();this.s.hp=this.s.mhp;
        this.s.techSkills=['basicQi'];
        this.s.tech={id:'basicQi',name:'基础吐纳术',cv:0,atk:0,def:0,dunst:0,ssense:0};
        if(pend.pack){this.s.ss+=60;this.s.hb+=10;}
        this.s.mag=this.s.mag+(this.s.magBonus||0);
        this.recalc();this.s.hp=this.s.mhp;this.s.sp=this.s.msp;
        this.s.daoTu=oldDao; // 默认续道, 转世界面可改
        this._chooseDao(function(){
            self.s.mag=self.s.mag+(self.s.magBonus||0);
            self.recalc();self.s.hp=self.s.mhp;self.s.sp=self.s.msp;
            // v8.0.4: 关键修复——先把界面切回洞府并关闭模态(用户"看见更新"的关键)，再做存档/日志等非关键操作；
            // 之前 switchScene 排在 log/save 之后，任一在真实环境抛异常就会跳过重绘，出现"点重修界面不动、得切场景/刷新才行"。
            self.switchScene('cave');
            self._closeMod(); /* v8.0: 关闭底蕴分配 overlay，露出新游戏 */
            self.refresh(); // 同步顶栏(境界/攻防/灵石等)；switchScene 只重绘场景面板，顶栏需 refresh
            try{ self.checkDaily(); }catch(e){}
            try{ self.save(); }catch(e){}
            try{ self.log("轮回重修（第"+self.s.meta.lives+"世）！继承：灵根资质+"+(pend.root*R.rootStep).toFixed(2)+" 道天赋+"+(pend.dao*R.daoStep*100).toFixed(0)+"% 寿元+"+(pend.life*R.lifeAdd)+(pend.pack?" 资源包":"")); }catch(e){}
            // 兜底：下一 tick 再确保一次洞府重绘，防任何同步路径漏网
            setTimeout(function(){ try{ self.switchScene('cave'); }catch(e){} },0);
        });
    },

                setTimeout(function(){
                    var ni=document.getElementById('nmInput'),nb=document.getElementById('cfNmBtn');
                    if(!ni||!nb) return;
                    ni.addEventListener('keydown',function(e){if(e.key==='Enter') nb.click();});
                    nb.addEventListener('click',function(){
                        self.s.pn=ni.value.trim()||'无名修士';
                        self.closeMod();
                        self._chooseDao(function(){
                            self.recalc();self.s.hp=self.s.mhp;self.s.sp=self.s.msp;
                            // v8.0.4: 同重修回调——先切洞府+关模态，非关键操作兜底
                            self.switchScene('cave');
                            self.refresh();
                            try{ self.checkDaily(); }catch(e){}
                            try{ self.save(); }catch(e){}
                            try{ self.log("踏入仙途，道心弥坚！"); }catch(e){}
                            setTimeout(function(){ try{ self.switchScene('cave'); }catch(e){} },0);
                        });
                    });
                },50);
            });
        },50);
    },
    _chooseDao: function(cb){
        var self=this, dt=this.DAOTU;
        var order=['jian','dan','ti','zhen','fu'];
        var html='<h3>择道而入</h3><div class="dao-grid">';
        order.forEach(function(k){
            var d=dt[k];
            html+='<div class="dao-opt" data-k="'+k+'"><b>'+d.name+'</b><small>'+d.desc+'</small><small style="color:#9fd0ff;">修炼×'+d.cv.toFixed(2)+'｜攻'+(d.atkFloor*100).toFixed(0)+'% 血'+(d.mhpFloor*100).toFixed(0)+'%'+(d.resName?'｜产'+d.resName:'')+'</small></div>';
        });
        html+='</div><button class="btn pr" id="cfDaoBtn" disabled>确定道途</button>';
        this.mod(html);
        setTimeout(function(){
            var picked=null;
            var opts=document.querySelectorAll('.dao-opt');
            opts.forEach(function(el){
                el.addEventListener('click',function(){
                    opts.forEach(function(x){x.classList.remove('sel');});
                    el.classList.add('sel');picked=el.getAttribute('data-k');
                    var b=document.getElementById('cfDaoBtn');if(b)b.disabled=false;
                });
            });
            var b=document.getElementById('cfDaoBtn');
            if(!b) return;
            b.addEventListener('click',function(){
                if(!picked) return;
                self.s.daoTu=picked;self.closeMod();
                if(cb) cb();
            });
        },50);
    },
    // v6: 常驻择道/转修入口(散修免费择道, 已择道花灵石转修并清旧道资源)
    pickDao: function(){
        var self=this;
        if(this.s.daoTu==='san'){
            this._chooseDao(function(){
                self.recalc();self.s.hp=self.s.mhp;self.s.sp=self.s.msp;
                self.save();self.refresh();
                self.log("择道而入，自此修行有了方向！");
            });
            return;
        }
        // 已择道 → 转修: 付费 + 舍弃旧道专属资源/精通(防无成本横跳)
        var cost=200*(this.s.r+1)*(this.s.sr+1);
        if(this.s.ss<cost){this.log("转修需"+cost+"灵石（当前"+this.s.ss+"）");return;}
        this.s.ss-=cost;this.save();
        this.mod('<h3>转修</h3><div class="note">将舍弃当前道途的专属资源与精通（剑意/阵基/符纸灵墨/淬体），花费 '+cost+' 灵石转修。</div><button class="btn pr" id="okZhuan">确认转修</button> <button class="btn" id="noZhuan">取消</button>');
        setTimeout(function(){
            var ok=document.getElementById('okZhuan'), no=document.getElementById('noZhuan');
            if(no) no.addEventListener('click',function(){self.s.ss+=cost;self.save();self.closeMod();self.log("已取消转修，灵石返还");});
            if(ok) ok.addEventListener('click',function(){
                ['jy','jz','fz','lm','jyLv','jzLv','fzLv','lmLv','tiLv'].forEach(function(k){self.s[k]=0;});
                self.closeMod();
                self._chooseDao(function(){
                    self.recalc();self.s.hp=self.s.mhp;self.s.sp=self.s.msp;
                    self.save();self.refresh();
                    self.log("转修成功，前尘道途已舍，新的道正在脚下。");
                });
            });
        },50);
    },

    // ===== 场景切换 =====
    switchScene: function(sc){
        this.curScene=sc;
        if(sc!=='wild'&&sc!=='dungeon'&&sc!=='arena') this._comboStop();
        /* 场景横幅已移除（v8.0）；场景标题由 _sceneTitle 在 _renderPn 时注入 */
        document.querySelectorAll('.scn').forEach(function(b){b.classList.remove('active');});
        var btns=document.querySelectorAll('.scn');
        btns.forEach(function(b){if(b.textContent.indexOf(this._scTxt(sc))>=0) b.classList.add('active');},this);
        document.querySelectorAll('.pnl').forEach(function(p){p.classList.remove('active');});
        var map={cave:'Cave',estate:'Estate',sect:'Sect',wild:'Wild',market:'Market',dungeon:'Dungeon',secret:'Secret',arena:'Arena'};
        var pnl=document.getElementById('pnl'+map[sc]);if(pnl) pnl.classList.add('active');
        this.render(sc);
    },
    _scTxt: function(sc){
        var m={cave:'洞府',estate:'仙府',sect:'宗门',wild:'野外',market:'坊市',dungeon:'副本',secret:'秘境',arena:'竞技'};
        return m[sc]||'';
    },

        if(s.eq.wp) eqinfo+=' 🗡️'+s.eq.wp.name;

    _sceneTitle: function(sc){

    // ===== 战斗可视化辅助 =====
    hpBar: function(cur,max){
        var m=max||1;

    _enemyCard: function(name,hp,maxhp,atk,isBoss){

    _playerCard: function(){
        var s=this.s;
        return '<div class="cbt-card player" id="cbtPlayer"><div class="cbt-top"><div class="cbt-ava p"></div><div class="cbt-info"><div class="cbt-name">'+s.pn+' <small style="color:#9fd0ff;">(你)</small></div>'+this.hpBar(s.hp,s.mhp)+'</div></div><div style="font-size:0.58rem;color:#9fd0ff;margin-top:2px;">攻 '+s.ba+' | 防 '+s.df+'</div></div>';

    _pushFx: function(side,dmg,crit,heal){
        if(!this._fxQ) this._fxQ=[];
        this._fxQ.push({side:side,dmg:dmg,crit:!!crit,heal:!!heal});
    },
    _floatDmg: function(side,dmg,crit,heal){
        var panel=document.querySelector('.pnl.active');
        if(!panel) return;
        var card=panel.querySelector(side==='enemy'?'.cbt-card.enemy':'.cbt-card.player');
        if(!card) return;
        var d=document.createElement('div');
        d.className='dmg-float '+(heal?'heal':(crit?'crit':'dmg'));
        d.textContent=(heal?'+':'-')+dmg;
        card.appendChild(d);
        if(!heal) card.classList.add('cbt-hit');
        setTimeout(function(){card.classList.remove('cbt-hit');},300);
        setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},900);
    },

    _renderDg: function(){
        var p=document.getElementById('pnlDungeon'), s=this.s;

                div.innerHTML='<span>'+d.name+' ('+d.fl+'层) '+(locked?'🔒':'')+'<br><small>灵石+'+d.rwd+' 灵力-'+d.cost+'</small></span><button class="btn '+(locked?'':'pr')+'" '+(locked?'disabled':'')+'>'+(locked?'需'+(self.REALMS[d.realmReq]?self.REALMS[d.realmReq].name:'')+'进入':'挑战')+'</button>';
                if(!locked) div.querySelector('button').addEventListener('click',function(){self.enterDg(i);});
                p.appendChild(div);
            });
        }else{
            var d=this.DUNGEONS[s.di];
            var isB=s.dmons.length===0;
            var t=isB?s.dboss:s.dmons[0];
            p.innerHTML=this._charHeader()+'<div class="dfl">'+d.name+' - 第'+s.dflr+'/'+d.fl+'层</div>';

                var bossCls='';

                if(bn.indexOf('魔')>=0||bn.indexOf('龙')>=0) bossCls='boss-dragon';
                else if(bn.indexOf('妖')>=0||bn.indexOf('狐')>=0) bossCls='boss-fox';
                else if(bn.indexOf('剑')>=0||bn.indexOf('灵')>=0||bn.indexOf('战')>=0) bossCls='boss-spirit';

            p.innerHTML+='<div style="display:flex;gap:0.3rem;align-items:center;"><button class="btn dg" onclick="G.dgFight();G.save();">攻击(-5)</button><span style="font-size:0.66rem;color:#9fd0a0;">连续</span><div class="toggle'+(this.s.combo?' on':'')+'" onclick="G.toggleCombo();G.save();"></div></div>';

                });
                sh+='</div>';

        if(!hasAny) h+='<div style="font-size:0.7rem;color:#888;">暂无功法，通过副本/秘境/云游/竞技获取</div>';

        var hasAny=false;
        this.PILLS.forEach(function(p,i){
            var inv=self.s.pills?.[i]||{};
            Object.keys(inv).forEach(function(gk){
                var cnt=inv[gk];
                if(cnt>0){
                    hasAny=true;
                    var mult={下品:0.5,中品:1.0,上品:1.3,极品:1.8};
                    var eff=Math.floor(p.rwd*mult[gk]);
                    h+='<div class="card"><span>'+gk+p.name+' x'+cnt+' <small>(突破率+'+eff+'%)</small></span><button class="btn bs pr" onclick="G.usePill('+i+',\''+gk+'\');G.save();G.closeMod();G.refresh();">服用</button></div>';
                }
            });
        });
        if(!hasAny) h+='<div style="font-size:0.7rem;color:#888;">无丹药库存，前往仙府炼制</div>';
        h+='<button class="btn bs" onclick="G.closeMod();">关闭</button>';
        this.mod(h);
    },
    _showEq: function(){
        var eq=this.s.eq,p=eq.rg||[], inv=this.s.inv||[], self=this;
        var h='<h3>装备管理</h3>';
        h+='<div style="font-size:0.75rem;margin:0.3rem 0;color:#ffd78b;">已装备：</div>';
        h+='<div class="card"><span>武器：'+(eq.wp?eq.wp.name+' (攻+'+eq.wp.atk+(eq.wp.enh?' +'+eq.wp.enh:'')+')':'无')+'</span>'+(eq.wp?'<div style="display:flex;gap:0.2rem;align-items:center;"><button class="btn bs dg" id="_uw">卸下</button>'+this._enhBtnHtml(eq.wp,'wp')+'</div>':'')+'</div>';
        h+='<div class="card"><span>防具：'+(eq.ar?eq.ar.name+' (防+'+eq.ar.def+',HP+'+eq.ar.hp+(eq.ar.enh?' +'+eq.ar.enh:'')+')':'无')+'</span>'+(eq.ar?'<div style="display:flex;gap:0.2rem;align-items:center;"><button class="btn bs dg" id="_ua">卸下</button>'+this._enhBtnHtml(eq.ar,'ar')+'</div>':'')+'</div>';
        h+='<div class="card"><span>饰品('+p.length+'/2)：'+(p.length>0?p.map(function(a,i){return a.name+(a.enh?' +'+a.enh:'')+'<button class="btn bs dg" style="margin-left:4px;" id="_ur'+i+'">卸</button>'+self._enhBtnHtml(a,'rg'+i);}).join(', '):'无')+'</span></div>';
        h+='<div style="font-size:0.75rem;margin:0.4rem 0;color:#ffd78b;">背包 ('+inv.length+'件)：</div>';
        if(inv.length===0) h+='<div style="font-size:0.65rem;color:#888;">背包为空</div>';
        else {
            // 去重：同类同名装备合并显示数量
            var grouped={};
            inv.forEach(function(item,i){
                var key=item.name+'_'+item.t;
                if(!grouped[key]) grouped[key]={item:item,indices:[]};
                grouped[key].indices.push(i);
            });
            Object.keys(grouped).forEach(function(k){
                var g=grouped[k], item=g.item, cnt=g.indices.length, idx=g.indices[0];
                h+='<div class="card"><span>'+item.name+(cnt>1?' x'+cnt:'')+' '+(item.t==='weapon'?'(攻+'+item.atk+')':item.t==='armor'?'(防+'+item.def+',HP+'+item.hp+')':'(攻+'+item.atk+',HP+'+item.hp+')')+'</span><button class="btn bs pr" id="_eq'+idx+'">装备</button></div>';
            });
        }
        h+='<br><button class="btn bs" id="_ce">关闭</button>';
        this.mod(h);
        var self2=this;
        setTimeout(function(){
            if(eq.wp) document.getElementById('_uw')?.addEventListener('click',function(){
                self2.s.inv.push(eq.wp);eq.wp=null;self2.recalc();self2.refresh();self2.closeMod();self2._showEq();
            });
            if(eq.ar) document.getElementById('_ua')?.addEventListener('click',function(){
                self2.s.inv.push(eq.ar);eq.ar=null;self2.recalc();self2.refresh();self2.closeMod();self2._showEq();
            });
            p.forEach(function(_,i){document.getElementById('_ur'+i)?.addEventListener('click',function(){
                self2.s.inv.push(p[i]);p.splice(i,1);self2.recalc();self2.refresh();self2.closeMod();self2._showEq();
            });});
            document.querySelectorAll('[data-enh]').forEach(function(b){
                b.addEventListener('click',function(){
                    var k=b.getAttribute('data-enh');
                    if(k==='wp') self2.enhanceEq('wp');
                    else if(k==='ar') self2.enhanceEq('ar');
                    else if(k.indexOf('rg')===0) self2.enhanceEq('rg',parseInt(k.slice(2),10));
                    self2.closeMod();self2.refresh();self2.save();self2._showEq();
                });
            });
            inv.forEach(function(item,i){document.getElementById('_eq'+i)?.addEventListener('click',function(){
                self2.addEq(item,true);self2.closeMod();self2.refresh();self2.save();self2._showEq();
            });});
            document.getElementById('_ce')?.addEventListener('click',function(){self2.closeMod();});
        },50);
    },

    showAch: function(){
        var h='<h3>成就 ('+Object.keys(this.s.achs).length+'/'+this.ACHS.length+')</h3>';
        var self=this;
        this.ACHS.forEach(function(a){
            var ul=self.s.achs[a.id];
            h+='<div class="ach-card'+(ul?'':' locked')+'"><span>'+(ul?'✅':'🔒')+' '+a.name+'</span><small>'+a.desc+'</small></div>';
        });
        h+='<button class="btn bs" id="_ca">关闭</button>';
        this.mod(h);
        var self2=this;
        setTimeout(function(){var b=document.getElementById('_ca');if(b) b.addEventListener('click',function(){self2.closeMod();});},50);
    },
    showDaily: function(){
        this.checkDaily();
        var h='<h3>日常任务</h3>', self=this;
        Object.keys(this.s.dts).forEach(function(k){
            var t=self.s.dts[k];
            h+='<div style="font-size:0.72rem;padding:0.3rem;">'+t.desc+' ('+t.prog+'/'+t.need+') '+(t.done?'✅':'⏳')+' 奖励:'+t.rwd+'灵石</div>';
        });
        h+='<button class="btn bs" id="_cd">关闭</button>';
        this.mod(h);
        setTimeout(function(){var b=document.getElementById('_cd');if(b) b.addEventListener('click',function(){self.closeMod();});},50);
    },

    // ===== UI刷新 =====
    refresh: function(){
        var s=this.s;
        var rn=this.REALMS[s.r].name+'·'+['前期','中期','后期'][s.sr];
        var ageStr=s.r>=6?'∞':Math.floor(s.ag)+'/'+(isFinite(s.mag)?s.mag:'∞');
        var sub=s.sr<2?this.subCost():'渡劫';
        document.getElementById('realm').textContent=rn+' | '+this.ROOTS[s.rt].name;
        document.getElementById('pname').textContent=s.pn+' · 修仙'+Math.floor(s.ag-20)+'载';
        var h='';
        h+='<div class="si">灵力 <span>'+Math.floor(s.sp)+'</span>/<span>'+s.msp+'</span></div>';
        h+='<div class="si">生命 <span>'+Math.floor(s.hp)+'</span>/<span>'+s.mhp+'</span></div>';
        h+='<div class="si">灵石 <span>'+s.ss+'</span></div>';
        h+='<div class="si">攻 <span>'+s.ba+'</span> | 防 <span>'+s.df+'</span></div>';
        h+='<div class="si">寿元 <span>'+ageStr+'</span>'+(s.r===6?' 飞升倒计时:'+Math.floor(s.ftl):'')+'</div>';
        h+='<div class="si">神识 <span>'+this.effSsense()+'</span> | 遁速 <span>'+this.effDunst()+'</span></div>';
        h+='<div class="si">突破率 <span>'+this.brRate()+'%</span> | 药材 <span>'+s.hb+'</span></div>';
        var pct=Math.min(100,(s.cv/this.maxCv())*100);
        h+='<div class="sbar"><span class="sbl">修为</span><div class="sbf"><div class="sbi" style="width:'+pct+'%"></div></div><span class="sbt">'+s.cv+'/'+this.maxCv()+'</span></div>';
        document.getElementById('stats').innerHTML=h;
        document.getElementById('logbox').innerHTML=s.logs.slice(-7).map(function(m){return '> '+m;}).join('<br>');
        // 同步刷新当前场景面板内容
        this._tickCooldowns();
        try{this.render(this.curScene);}catch(e){}
        // 飘字伤害：渲染完成后触发
        if(this._fxQ&&this._fxQ.length){
            var q=this._fxQ;this._fxQ=null;var self=this;
            setTimeout(function(){q.forEach(function(f){self._floatDmg(f.side,f.dmg,f.crit,f.heal);});},0);
        }
    },
    // 兼容旧调用
    refreshAndRender: function(){this.refresh();},

    // ===== 初始化 =====
    init: function(){
        try{
            this.s=this.defState();
            var loaded=this.load();
            if(!loaded){
                // 新号: 弹性别/道号/择道, 之后落地洞府
                this.startNew();
                this.switchScene('cave');
            }else{
                this.log("读档成功");
                this.refresh();
                this.switchScene('cave');
                this.checkDaily();
                // v6: 老档迁移(无道途)载入后自动提示择道一次(关掉不卡死)
                if(this._needDaoPrompt){
                    this._needDaoPrompt=false;
                    var self=this;
                    this._chooseDao(function(){ self.recalc();self.s.hp=self.s.mhp;self.s.sp=self.s.msp;self.save();self.refresh();self.log("旧档新途，自此有了修行方向！"); });
                }
            }
            this.startAutosave();
            if(this.s&&this.s.auto) this.toggleAuto();
            if(this.s&&this.s.autoAlch) this.toggleAutoAlch();
            this._checkUpdate(); // v8.0.1: 启动后自检远端版本，无需手动硬刷新
            try{var vt=document.getElementById('verTag');if(vt)vt.textContent='v'+this.VER;}catch(e){} // v8.0.4: 顶栏显示版本号，便于确认是否命中旧缓存
        }catch(e){
            console.error("初始化失败:",e);
            try{localStorage.removeItem(this.SAVE_KEY);}catch(x){}
            this.startNew();
            this.switchScene('cave');
        }
    }
};

// Run
window.addEventListener('DOMContentLoaded',function(){
    var ROOTS=G.ROOTS;
    G.init();
});
</script>
